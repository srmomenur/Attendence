<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Pro</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --primary: #2563eb;
        --primary2: #4f46e5;
        --success: #16a34a;
        --danger: #dc2626;
        --bg: #f4f7fb;
        --card: #fff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
      }

      body.dark {
        --bg: #080d1a;
        --card: #111827;
        --text: #f9fafb;
        --muted: #9ca3af;
        --border: #263244;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(
            circle at top right,
            rgba(37, 99, 235, 0.12),
            transparent 30%
          ),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 25px 15px;
        transition: 0.3s;
      }

      button,
      input {
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      .container {
        width: 100%;
        max-width: 920px;
        margin: auto;
      }

      .top-section {
        width: 100%;
      }

      .header {
        position: relative;
        background: linear-gradient(135deg, var(--primary), var(--primary2));
        color: #fff;
        border-radius: 18px;
        padding: 24px;
        margin-bottom: 15px;
        box-shadow: 0 15px 35px rgba(37, 99, 235, 0.22);
        overflow: hidden;
      }

      .header:before {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.09);
        right: -70px;
        top: -70px;
      }

      .header-content {
        position: relative;
        z-index: 2;
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .header h1 {
        font-size: 27px;
      }

      .header p {
        font-size: 13px;
        opacity: 0.88;
      }

      .date-text {
        font-size: 12px;
        opacity: 0.8;
        margin-top: 5px;
      }

      .theme-btn {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 19px;
      }

      .date-selector {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 15px;
      }

      .date-selector button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 18px;
      }

      .date-selector input {
        flex: 1;
        height: 36px;
        border: 0;
        border-radius: 10px;
        padding: 0 10px;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        outline: 0;
        color-scheme: dark;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }

      .stat-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 15px 8px;
        text-align: center;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      }

      .stat-number {
        display: block;
        font-size: 26px;
        font-weight: 800;
        color: var(--primary);
      }

      .stat-label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
        text-transform: uppercase;
      }

      .progress-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
      }

      .progress-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 13px;
      }

      .percentage {
        font-weight: bold;
        color: var(--success);
      }

      .progress-bar {
        height: 9px;
        background: var(--border);
        border-radius: 20px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0;
        border-radius: 20px;
        background: linear-gradient(90deg, #16a34a, #22c55e);
        transition: width 0.4s;
      }

      .search-box {
        background: var(--card);
        padding: 10px;
        border-radius: 15px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.04);
      }

      .search-wrapper {
        position: relative;
      }

      .search-icon {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 17px;
        opacity: 0.65;
      }

      .search-box input {
        width: 100%;
        height: 45px;
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 0 40px;
        font-size: 14px;
        outline: 0;
        background: var(--bg);
        color: var(--text);
      }

      .filters {
        display: flex;
        gap: 7px;
        margin-bottom: 10px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .filters::-webkit-scrollbar {
        display: none;
      }

      .filter-btn {
        white-space: nowrap;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--muted);
        border-radius: 20px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: bold;
      }

      .filter-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .student-list {
        background: var(--card);
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        margin-bottom: 15px;
      }

      .list-header,
      .student {
        display: grid;
        grid-template-columns: 35px 60px 1fr 70px;
        gap: 7px;
        align-items: center;
      }

      .list-header {
        padding: 13px 15px;
        background: rgba(37, 99, 235, 0.05);
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        font-weight: bold;
        color: var(--muted);
        text-transform: uppercase;
      }

      .student {
        padding: 13px 15px;
        border-bottom: 1px solid var(--border);
        transition: 0.2s;
      }

      .student:last-child {
        border-bottom: 0;
      }

      .student:active {
        transform: scale(0.99);
      }

      .student.present {
        background: rgba(22, 163, 74, 0.08);
      }

      .serial {
        color: var(--muted);
        font-size: 12px;
      }

      .student-id {
        font-size: 14px;
        font-weight: 800;
        color: var(--primary);
      }

      .student-name {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
      }

      .status-text {
        font-size: 9px;
        margin-top: 3px;
        color: var(--muted);
      }

      .student.present .status-text {
        color: var(--success);
        font-weight: bold;
      }

      .check-area {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .check-area input {
        appearance: none;
        width: 28px;
        height: 28px;
        border: 2px solid #cbd5e1;
        border-radius: 9px;
        cursor: pointer;
        position: relative;
        background: var(--card);
        transition: 0.2s;
      }

      .check-area input:checked {
        background: var(--success);
        border-color: var(--success);
        box-shadow: 0 0 12px rgba(22, 163, 74, 0.3);
      }

      .check-area input:checked:after {
        content: "✓";
        color: #fff;
        font-size: 18px;
        font-weight: bold;
        position: absolute;
        left: 4px;
        top: 0;
        animation: checkPop 0.2s ease;
      }

      @keyframes checkPop {
        0% {
          transform: scale(0);
        }

        70% {
          transform: scale(1.2);
        }

        100% {
          transform: scale(1);
        }
      }

      .quick-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 10px;
      }

      .quick-btn {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 6px;
        font-size: 11px;
        font-weight: bold;
        background: var(--card);
        color: var(--text);
      }

      .quick-btn.primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .quick-btn.success {
        background: rgba(22, 163, 74, 0.1);
        color: var(--success);
      }

      .quick-btn.danger {
        background: rgba(220, 38, 38, 0.08);
        color: var(--danger);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-bottom: 15px;
      }

      .action-btn {
        border: 0;
        border-radius: 12px;
        padding: 13px;
        font-size: 13px;
        font-weight: bold;
      }

      .generate-btn {
        background: linear-gradient(135deg, var(--primary), var(--primary2));
        color: #fff;
      }

      .undo-btn {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .export-actions {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-bottom: 15px;
      }

      .export-btn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 11px;
        padding: 10px;
        font-size: 11px;
        font-weight: bold;
      }

      .output-section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
      }

      .output-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .output-title h2 {
        font-size: 16px;
      }

      .copy-btn {
        border: 0;
        background: #111827;
        color: #fff;
        border-radius: 9px;
        padding: 8px 12px;
        font-size: 11px;
        font-weight: bold;
      }

      body.dark .copy-btn {
        background: #374151;
      }

      textarea {
        width: 100%;
        min-height: 170px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 12px;
        font-family: monospace;
        font-size: 15px;
        line-height: 1.7;
        outline: 0;
        background: var(--bg);
        color: var(--text);
      }

      .empty-message {
        text-align: center;
        padding: 35px 15px;
        color: var(--muted);
        font-size: 13px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 25px;
        transform: translate(-50%, 100px);
        background: #111827;
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: bold;
        z-index: 99999;
        opacity: 0;
        transition: 0.3s;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .toast.show {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      @media (max-width: 600px) {
        body {
          padding: 0 8px 15px;
        }

        .container {
          max-width: 100%;
        }

        .top-section {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          width: 100%;
          z-index: 9999;
          background: var(--bg);
          padding: 10px 8px 0;
          box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .header {
          padding: 17px;
          margin-bottom: 8px;
          border-radius: 16px;
        }

        .header h1 {
          font-size: 21px;
        }

        .header p {
          font-size: 11px;
        }

        .date-text {
          font-size: 10px;
        }

        .theme-btn {
          width: 38px;
          height: 38px;
          font-size: 17px;
        }

        .date-selector {
          margin-top: 10px;
        }

        .date-selector button {
          width: 32px;
          height: 32px;
        }

        .date-selector input {
          height: 32px;
          font-size: 11px;
        }

        .stats {
          gap: 7px;
          margin-bottom: 8px;
        }

        .stat-box {
          padding: 10px 5px;
          border-radius: 13px;
        }

        .stat-number {
          font-size: 22px;
        }

        .stat-label {
          font-size: 9px;
        }

        .progress-card {
          padding: 10px 12px;
          margin-bottom: 8px;
          border-radius: 13px;
        }

        .progress-top {
          font-size: 11px;
        }

        .progress-bar {
          height: 7px;
        }

        .search-box {
          padding: 8px;
          margin-bottom: 7px;
        }

        .search-box input {
          height: 40px;
          font-size: 13px;
        }

        .filters {
          margin-bottom: 8px;
        }

        .filter-btn {
          padding: 7px 12px;
          font-size: 10px;
        }

        .student-list {
          margin-top: var(--top-height, 390px);
          border-radius: 14px;
          margin-bottom: 12px;
        }

        .list-header,
        .student {
          grid-template-columns: 28px 50px 1fr 55px;
        }

        .list-header {
          padding: 11px 9px;
          font-size: 9px;
        }

        .student {
          padding: 12px 9px;
        }

        .serial {
          font-size: 10px;
        }

        .student-id {
          font-size: 13px;
        }

        .student-name {
          font-size: 12px;
        }

        .status-text {
          font-size: 8px;
        }

        .check-area input {
          width: 25px;
          height: 25px;
        }

        .quick-actions,
        .export-actions {
          gap: 6px;
        }

        .quick-btn,
        .export-btn {
          padding: 10px 4px;
          font-size: 9px;
        }

        .actions {
          grid-template-columns: 1fr 1fr;
        }

        .action-btn {
          padding: 12px 6px;
          font-size: 11px;
        }

        .output-section {
          padding: 13px;
          border-radius: 15px;
        }

        .output-title h2 {
          font-size: 14px;
        }

        .toast {
          bottom: 20px;
          font-size: 12px;
        }
      }

      @media print {
        body {
          background: #fff !important;
          color: #000 !important;
          padding: 0;
        }

        .top-section,
        .quick-actions,
        .actions,
        .export-actions,
        .output-section {
          display: none !important;
        }

        .student-list {
          margin-top: 0 !important;
          border: 1px solid #ccc;
          box-shadow: none;
        }

        .student {
          break-inside: avoid;
        }

        .check-area input {
          display: none;
        }

        .list-header,
        .student {
          color: #000 !important;
        }

        .student.present {
          background: #eee !important;
        }

        .container {
          max-width: 100%;
        }
      }
    </style>
    <style id="modern-upgrade">
      body {
        background:
          radial-gradient(
            circle at 10% 10%,
            rgba(79, 70, 229, 0.14),
            transparent 28%
          ),
          radial-gradient(
            circle at 90% 20%,
            rgba(14, 165, 233, 0.12),
            transparent 25%
          ),
          var(--bg);
        background-attachment: fixed;
      }

      body:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        opacity: 0.28;
        background-image:
          linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
        background-size: 34px 34px;
      }

      .header {
        animation: heroIn 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
        background: linear-gradient(135deg, #2563eb, #4f46e5, #7c3aed);
      }

      .header:after {
        content: "";
        position: absolute;
        inset: -80%;
        background: linear-gradient(
          115deg,
          transparent 43%,
          rgba(255, 255, 255, 0.13) 50%,
          transparent 57%
        );
        animation: shine 7s linear infinite;
        pointer-events: none;
      }

      .stat-box,
      .progress-card,
      .search-box,
      .student-list,
      .output-section {
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .stat-box {
        transition:
          transform 0.25s,
          box-shadow 0.25s,
          border-color 0.25s;
      }

      .stat-box:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 30px rgba(37, 99, 235, 0.12);
        border-color: rgba(37, 99, 235, 0.25);
      }

      .stat-number {
        transition: transform 0.25s;
      }

      .stat-box:hover .stat-number {
        transform: scale(1.08);
      }

      .progress-fill {
        position: relative;
        overflow: hidden;
      }

      .progress-fill:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );
        transform: translateX(-100%);
        animation: progressShine 2.2s infinite;
      }

      .search-box input {
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s;
      }

      .search-box input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.11);
        transform: translateY(-1px);
      }

      .student {
        animation: rowIn 0.38s both;
        transition:
          background 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }

      .student:hover {
        background: rgba(37, 99, 235, 0.055);
        transform: translateX(3px);
      }

      .student.present {
        box-shadow: inset 3px 0 0 var(--success);
      }

      .check-area input {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .check-area input:hover {
        transform: scale(1.08);
      }

      .check-area input:checked {
        animation: checkGlow 0.45s ease;
      }

      .quick-btn,
      .action-btn,
      .export-btn,
      .filter-btn,
      .copy-btn {
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          filter 0.18s;
      }

      .quick-btn:hover,
      .action-btn:hover,
      .export-btn:hover,
      .filter-btn:hover,
      .copy-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.09);
        filter: brightness(1.03);
      }

      .quick-btn:active,
      .action-btn:active,
      .export-btn:active,
      .filter-btn:active,
      .copy-btn:active {
        transform: scale(0.96);
      }

      .student-list {
        animation: fadeUp 0.55s 0.08s both;
      }

      .output-section {
        animation: fadeUp 0.55s 0.15s both;
      }

      .theme-btn {
        transition:
          transform 0.25s,
          background 0.25s;
      }

      .theme-btn:hover {
        transform: rotate(18deg) scale(1.08);
        background: rgba(255, 255, 255, 0.23);
      }

      @keyframes heroIn {
        from {
          opacity: 0;
          transform: translateY(-18px) scale(0.98);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateY(7px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes shine {
        0% {
          transform: translateX(-35%);
        }

        100% {
          transform: translateX(35%);
        }
      }

      @keyframes progressShine {
        0%,
        35% {
          transform: translateX(-100%);
        }

        65%,
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes checkGlow {
        0% {
          transform: scale(0.75);
          box-shadow: 0 0 0 rgba(22, 163, 74, 0);
        }

        55% {
          transform: scale(1.15);
          box-shadow: 0 0 22px rgba(22, 163, 74, 0.38);
        }

        100% {
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <style id="smooth-mobile-upgrade">
      html {
        scroll-behavior: smooth;
      }

      body {
        -webkit-overflow-scrolling: touch;
      }

      @media (max-width: 600px) {
        body {
          padding: 0 7px 14px;
          overflow-x: hidden;
          overscroll-behavior-x: none;
        }

        .top-section {
          padding: 6px 7px 0;
          box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
        }

        .header {
          padding: 10px 12px;
          margin-bottom: 6px;
          border-radius: 13px;
          box-shadow: 0 7px 18px rgba(37, 99, 235, 0.15);
        }

        .header-top {
          margin-bottom: 4px;
        }

        .header h1 {
          font-size: 17px;
          line-height: 1.15;
        }

        .header p {
          font-size: 9px;
          margin-top: 2px;
        }

        .date-text {
          font-size: 8px;
          margin-top: 2px;
        }

        .theme-btn {
          width: 31px;
          height: 31px;
          font-size: 14px;
        }

        .date-selector {
          margin-top: 6px;
          gap: 5px;
        }

        .date-selector button {
          width: 27px;

        ["231311022", "MD. NUR AMAN"],
        ["231311023", "SAMIHA FARJANA"],
        ["231311024", "MD. SHAKIL AHMED"],
        ["231311025", "SAHRUK ALAM SARDER"],
        ["231311026", "MD. PARVEZ MOSHAROF"],
        ["231311027", "MST. ARIFA AKHTAR CHANDNI"],
        ["231311032", "REZWANA KARIM"],
        ["231311034", "MD KARIM"],
        ["231311035", "MST.KHADIZA ALAM MOMI"],
        ["231311036", "MD. HASIB NADIM"],
        ["231311038", "MD. NAZMUL HASAN"],
        ["231311040", "MD. FAHIM AKHTAR"],
        ["231311081", "NAWSHIN SULTANA"],
        ["231311083", "RAHUL KHAN RAJ"],
        ["231311084", "MD. SHIBLU HOSSEN"],
        ["231311086", "MST. ROHIMA AKTER RIMI"],
        ["231311090", "MD. SHAHRIAR HASAN TONMOY"],
        ["231311094", "HASIB AL NABIL"],
        ["231311096", "MD. MOMENUR RASHID"],
        ["231311101", "MD. SABIUR RAHMAN"],
        ["231311102", "MST. AYESHA SIDDIQUA"],
        ["231311103", "MOST. IFFAT SARMILA"],
        ["231311104", "MST. SUMAYA KHATUN"],
        ["231311105", "FATEMATUZZOHURA BORSHA"],
        ["231311106", "RAISHA NURAYAN POROMA"],
        ["231311114", "MD. BISHAL SARKAR"],
        ["231311117", "MST. SUMIA SHARMIN NITU"],
        ["231311118", "SHAMIA AKTER NIPA"],
        ["231311122", "ISRAT JAHAN EMU"],
        ["231311125", "MD. NAFIZUR RAHMAN PARVEZ"],
        ["231311127", "MD. ABDULLAH AL-IBN-REAL SHAOWN"],
        ["231311128", "MAHFUJUR RAHMAN SHANTO"],
      ].map(([id, name]) => ({ id, name }));

      let attendance = {},
        currentFilter = "all",
        currentDate = getTodayDate(),
        previousAttendance = null,
        animateCheckboxId = null;
      const studentList = document.getElementById("studentList"),
        presentCount = document.getElementById("presentCount"),
        absentCount = document.getElementById("absentCount"),
        totalCount = document.getElementById("totalCount"),
        percentage = document.getElementById("percentage"),
        progressFill = document.getElementById("progressFill"),
        output = document.getElementById("output"),
        datePicker = document.getElementById("datePicker");

      function getTodayDate() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function formatDate(s) {
        return new Date(s + "T00:00:00").toLocaleDateString("en-US", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }
      function storageKey() {
        return "attendance_" + currentDate;
      }
      function saveAttendance() {
        localStorage.setItem(storageKey(), JSON.stringify(attendance));
      }
      function loadAttendance() {
        try {
          attendance = JSON.parse(localStorage.getItem(storageKey()) || "{}");
        } catch {
          attendance = {};
        }
      }
      function updateDateDisplay() {
        datePicker.value = currentDate;
        document.getElementById("headerDate").textContent =
          formatDate(currentDate);
        document.getElementById("dateDisplay").textContent = new Date(
          currentDate + "T00:00:00",
        ).toLocaleDateString("en-US", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }
      function loadSelectedDate() {
        currentDate = datePicker.value || getTodayDate();
        loadAttendance();
        previousAttendance = null;
        output.value = "";
        updateDateDisplay();
        renderStudents();
        updateStats();
        updateOutputLive();
        showToast("Attendance loaded");
      }
      function changeDate(days) {
        const d = new Date(currentDate + "T00:00:00");
        d.setDate(d.getDate() + days);
        currentDate = d.toISOString().split("T")[0];
        loadSelectedDate();
      }

      function setAttendance(id, checked) {
        previousAttendance = JSON.stringify(attendance);
        animateCheckboxId = id;

        if (checked) {
          attendance[id] = true;
        } else {
          delete attendance[id];
        }

        saveAttendance();
        renderStudents();
      }

      function toggleStudentRow(id) {
        previousAttendance = JSON.stringify(attendance);
        animateCheckboxId = id;

        if (attendance[id]) {
          delete attendance[id];
          showToast("Student marked Absent");
        } else {
          attendance[id] = true;
          showToast("✓ Student marked Present");
        }

        saveAttendance();
        renderStudents();
      }

      function renderStudents() {
        studentList.innerHTML = "";

        const search = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();

        const filtered = students.filter((s) => {
          const matchSearch =
            s.id.toLowerCase().includes(search) ||
            s.id.slice(-3).includes(search) ||
            s.name.toLowerCase().includes(search);

          const present = !!attendance[s.id];

          return (
            matchSearch &&
            (currentFilter === "all" ||
              (currentFilter === "present" && present) ||
              (currentFilter === "absent" && !present))
          );
        });

        if (!filtered.length) {
          studentList.innerHTML =
            '<div class="empty-message">🔍<br><br>No student found.</div>';
          updateStats();
          setTopHeight();
          return;
        }

        filtered.forEach((s, index) => {
          const present = !!attendance[s.id];
          const row = document.createElement("div");

          row.className = "student" + (present ? " present" : "");

          row.innerHTML = `
      <div class="serial">${String(students.indexOf(s) + 1).padStart(2, "0")}</div>
      <div class="student-id">${s.id.slice(-3)}</div>
      <div>
        <div class="student-name">${s.name}</div>
        <div class="status-text">${present ? "● PRESENT" : "○ ABSENT"}</div>
      </div>
      <div class="check-area">
        <input type="checkbox" ${present ? "checked" : ""} aria-label="Mark ${s.name} present">
      </div>
    `;

          const checkbox = row.querySelector("input");

          checkbox.addEventListener("click", (e) => e.stopPropagation());

          checkbox.addEventListener("change", () => {
            setAttendance(s.id, checkbox.checked);
          });

          row.addEventListener("click", () => {
            toggleStudentRow(s.id);
          });

          row.style.animationDelay = Math.min(index * 18, 260) + "ms";

          studentList.appendChild(row);
        });

        updateStats();
        setTopHeight();

        // Only the row that was just tapped gets the check animation.
        if (animateCheckboxId) {
          requestAnimationFrame(() => {
            const rows = studentList.querySelectorAll(".student");
            rows.forEach((row) => {
              const idEl = row.querySelector(".student-id");
              const checkbox = row.querySelector("input");
              if (
                idEl &&
                checkbox &&
                idEl.textContent.trim() === animateCheckboxId.slice(-3)
              ) {
                checkbox.classList.add("just-tapped");
                setTimeout(() => checkbox.classList.remove("just-tapped"), 260);
              }
            });
          });
        }

        animateCheckboxId = null;
      }

      function updateStats() {
        const present = students.filter((s) => !!attendance[s.id]).length;
        const total = students.length;
        const absent = total - present;
        const percent = total ? (present / total) * 100 : 0;

        // Legacy elements, if they still exist.
        const presentEl = document.getElementById("presentCount");
        const absentEl = document.getElementById("absentCount");
        const totalEl = document.getElementById("totalCount");
        const percentEl = document.getElementById("percentage");
        const progressEl = document.getElementById("progressFill");

        if (presentEl) presentEl.textContent = present;
        if (absentEl) absentEl.textContent = absent;
        if (totalEl) totalEl.textContent = total;
        if (percentEl) percentEl.textContent = percent.toFixed(1) + "%";
        if (progressEl) progressEl.style.width = percent + "%";

        // Header live elements.
        const headerPresent = document.getElementById("headerPresent");
        const headerTotal = document.getElementById("headerTotal");
        const headerPercent = document.getElementById("headerPercentage");
        const headerProgress = document.getElementById("headerProgressFill");
        const headerStatus = document.getElementById("attendanceStatus");

        if (headerPresent) headerPresent.textContent = present;
        if (headerTotal) headerTotal.textContent = total;
        if (headerPercent) headerPercent.textContent = percent.toFixed(1) + "%";
        if (headerProgress) headerProgress.style.width = percent + "%";

        if (headerStatus) {
          headerStatus.textContent =
            present === total
              ? "Attendance Complete"
              : present > 0
                ? "Attendance In Progress"
                : "Ready to Take Attendance";
        }

        updateOutputLive();
      }

      function searchStudents() {
        renderStudents();
      }

      function setFilter(f, button) {
        currentFilter = f;
        document
          .querySelectorAll(".filter-btn")
          .forEach((x) => x.classList.remove("active"));
        button.classList.add("active");
        renderStudents();
      }

      function markAllPresent() {
        const total = students.length;

        if (Object.keys(attendance).length === total) {
          return showToast("All students are already Present");
        }

        if (!confirm(`Mark all ${total} students as Present?`)) return;

        previousAttendance = JSON.stringify(attendance);

        students.forEach((s) => (attendance[s.id] = true));

        saveAttendance();
        renderStudents();
        showToast("✓ All students marked Present");
      }

      function clearAll() {
        const count = Object.keys(attendance).length;

        if (!count) {
          return showToast("Attendance is already empty");
        }

        if (!confirm(`Remove attendance for ${count} students?`)) return;

        previousAttendance = JSON.stringify(attendance);
        attendance = {};

        saveAttendance();
        renderStudents();
        showToast("Attendance reset");
      }

      function undoLastAction() {
        if (previousAttendance === null) {
          return showToast("Nothing to undo");
        }

        attendance = JSON.parse(previousAttendance);
        previousAttendance = null;

        saveAttendance();
        renderStudents();
        showToast("↩ Last action undone");
      }

      function updateOutputLive() {
        const ids = students
          .filter((s) => !!attendance[s.id])
          .map((s) => s.id.slice(-3));

        const text = ids.join("\n");

        const outputText = document.getElementById("outputText");
        const outputCount = document.getElementById("outputCount");
        const outputPlaceholder = document.getElementById("outputPlaceholder");

        if (outputText) {
          outputText.textContent = text;
          outputText.style.display = ids.length ? "block" : "none";
        }

        if (outputCount) {
          outputCount.textContent = ids.length;
        }

        if (outputPlaceholder) {
          outputPlaceholder.style.display = ids.length ? "none" : "block";
        }

        if (output) {
          output.value = text;
        }
      }

      function toggleMoreMenu() {
        document.getElementById("moreMenu").classList.toggle("show");
      }

      function generateAttendance() {
        updateOutputLive();
        const text = output ? output.value : "";

        if (!text.trim()) {
          return showToast("No Present students");
        }

        copyText(text);
        showToast(
          `${text.split("\n").filter(Boolean).length} Present IDs copied`,
        );
      }

      function copyResult() {
        updateOutputLive();

        const text = output ? output.value : "";

        if (!text.trim()) {
          return showToast("No Present IDs");
        }

        copyText(text);
        showToast(
          `${text.split("\n").filter(Boolean).length} Present IDs copied`,
        );
      }

      function copyText(text) {
        if (navigator.clipboard)
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        else fallbackCopy(text);
      }
      function fallbackCopy(text) {
        const t = document.createElement("textarea");
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        t.remove();
      }

      function downloadFile(content, name, type) {
        const blob = new Blob([content], { type }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }
      function exportTXT() {
        const ids = students
          .filter((s) => attendance[s.id])
          .map((s) => s.id.slice(-3));
        if (!ids.length) return showToast("No Present students");
        downloadFile(
          ids.join("\n"),
          `attendance_${currentDate}.txt`,
          "text/plain",
        );
        showToast("TXT downloaded");
      }
      function exportCSV() {
        const p = students.filter((s) => attendance[s.id]);
        if (!p.length) return showToast("No Present students");
        let csv = "ID,Student Name,Status,Date\n";
        p.forEach(
          (s) =>
            (csv += `"${s.id.slice(-3)}","${s.name.replace(/"/g, '""')}","Present","${currentDate}"\n`),
        );
        downloadFile(csv, `attendance_${currentDate}.csv`, "text/csv");
        showToast("CSV downloaded");
      }

      function toggleTheme() {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        localStorage.setItem("attendance_theme", dark ? "dark" : "light");
        document.getElementById("themeButton").textContent = dark ? "☀️" : "🌙";
      }
      function loadTheme() {
        if (localStorage.getItem("attendance_theme") === "dark") {
          document.body.classList.add("dark");
          document.getElementById("themeButton").textContent = "☀️";
        }
      }
      function setTopHeight() {
        if (innerWidth <= 600) {
          document.documentElement.style.setProperty(
            "--top-height",
            document.getElementById("topSection").offsetHeight + 8 + "px",
          );
        }
      }
      let toastTimer;
      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
      }
      function initialize() {
        datePicker.value = currentDate;
        updateDateDisplay();
        loadTheme();
        loadAttendance();
        renderStudents();
        updateStats();
        setTopHeight();
      }
      addEventListener("resize", setTopHeight);
      initialize();
      updateOutputLive();
      requestAnimationFrame(setTopHeight);
    </script>
  </body>
</html>
