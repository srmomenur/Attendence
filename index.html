<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loopify" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />

    <!-- Google Modern Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>Loopify - Smart Attendance</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-main: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --primary: #2563eb;
        --primary-glow: rgba(37, 99, 235, 0.25);
        --primary-dark: #1d4ed8;
        --primary2: #4f46e5;
        --success: #16a34a;
        --success-glow: rgba(22, 163, 74, 0.2);
        --success-bg: rgba(22, 163, 74, 0.08);
        --danger: #dc2626;
        --danger-bg: rgba(220, 38, 38, 0.08);
        --bg: #f8fafc;
        --card: #ffffff;
        --card-hover: rgba(37, 99, 235, 0.04);
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --header-gradient: linear-gradient(135deg, #2563eb, #4f46e5 50%, #7c3aed);
        --footer-bg: rgba(255, 255, 255, 0.94);
        --footer-shadow: 0 -8px 20px rgba(15, 23, 42, 0.06);
        --radius-lg: 16px;
        --radius-md: 11px;
        --radius-sm: 8px;
      }

      body.dark {
        --bg: #090d16;
        --card: #131b2e;
        --card-hover: rgba(59, 130, 246, 0.06);
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #1e293b;
        --header-gradient: linear-gradient(135deg, #1d4ed8, #3730a3 50%, #6d28d9);
        --footer-bg: rgba(19, 27, 46, 0.94);
        --footer-shadow: 0 -8px 20px rgba(0, 0, 0, 0.4);
      }

      body {
        font-family: var(--font-main);
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 10px 10px 145px;
        transition: background-color 0.25s ease, color 0.25s ease;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      button,
      input,
      select,
      textarea {
        font-family: var(--font-main);
      }

      button {
        cursor: pointer;
        user-select: none;
      }

      .container {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
      }

      /* ===== 1. ORIGINAL HERO HEADER (LEFT-ALIGNED / SPACE-BETWEEN) ===== */
      .hero-header {
        position: relative;
        background: var(--header-gradient);
        color: #ffffff;
        border-radius: var(--radius-lg);
        padding: 18px 20px 16px;
        margin-bottom: 10px;
        box-shadow: 0 10px 25px var(--primary-glow);
        overflow: hidden;
      }

      .hero-header::before {
        content: "";
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        right: -50px;
        top: -50px;
        pointer-events: none;
      }

      .hero-header-content {
        position: relative;
        z-index: 2;
      }

      .hero-header-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }

      .hero-title {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .hero-subtitle {
        font-size: 12.5px;
        opacity: 0.88;
        margin-top: 2px;
        font-weight: 500;
      }

      .hero-date-text {
        font-size: 11.5px;
        opacity: 0.82;
        margin-top: 3px;
        font-weight: 500;
      }

      .theme-btn {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .theme-btn:hover {
        transform: scale(1.08);
        background: rgba(255, 255, 255, 0.3);
      }

      /* Course Selector Bar in Hero Header */
      .hero-course-bar {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: var(--radius-sm);
        padding: 6px 12px;
        backdrop-filter: blur(8px);
      }

      .hero-course-bar label {
        font-size: 12.5px;
        font-weight: 800;
        white-space: nowrap;
      }

      .hero-course-bar select {
        flex: 1;
        background: transparent;
        color: #ffffff;
        border: 0;
        outline: 0;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
      }

      .hero-course-bar select option {
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
      }

      /* Live Summary in Hero Header */
      .hero-live-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        font-size: 12.5px;
      }

      .hero-live-status {
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0.95;
      }

      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.25);
      }

      .hero-live-summary strong {
        font-size: 13.5px;
        font-weight: 800;
      }

      .hero-progress {
        height: 6px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 8px;
      }

      .hero-progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 10px;
        background: #ffffff;
        transition: width 0.3s ease;
      }

      .hero-percentage {
        text-align: right;
        font-size: 11px;
        font-weight: 800;
        margin-top: 3px;
        opacity: 0.95;
      }

      /* Date Selector in Hero Header */
      .hero-date-selector {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }

      .date-nav-btn {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        font-size: 18px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s ease;
      }

      .date-nav-btn:hover {
        background: rgba(255, 255, 255, 0.32);
      }

      .hero-date-display {
        flex: 1;
        height: 34px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        user-select: none;
      }

      .hero-date-display:hover {
        background: rgba(255, 255, 255, 0.32);
      }

      /* Hidden Date Picker Trigger */
      .hero-date-display input[type="date"],
      .c-date-display input[type="date"] {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
        pointer-events: none;
      }

      /* ===== 2. STICKY LOCKED SECTION (ACTIVATES ON SCROLL) ===== */
      .sticky-wrapper {
        position: sticky;
        top: 0;
        z-index: 900;
        background: var(--bg);
        padding: 5px 0 6px;
        transition: box-shadow 0.25s ease;
      }

      body.is-scrolled .sticky-wrapper {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      /* Compact header: hidden at top, expands smoothly when scrolled down */
      .compact-sticky-header {
        background: var(--header-gradient);
        color: #ffffff;
        border-radius: var(--radius-md);
        box-shadow: 0 4px 14px var(--primary-glow);
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        padding: 0 10px;
        margin-bottom: 0;
        pointer-events: none;
        transition: max-height 0.26s cubic-bezier(0.16, 1, 0.3, 1),
                    opacity 0.2s ease,
                    padding 0.26s ease,
                    margin-bottom 0.26s ease;
      }

      body.is-scrolled .compact-sticky-header {
        max-height: 75px;
        opacity: 1;
        pointer-events: auto;
        padding: 7px 10px 5px;
        margin-bottom: 6px;
      }

      .compact-main-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }

      .compact-brand-course {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }

      .compact-logo {
        font-size: 14px;
        font-weight: 800;
        white-space: nowrap;
      }

      .compact-select-box {
        flex: 1;
        min-width: 0;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 6px;
        padding: 2px 6px;
      }

      .compact-select-box select {
        width: 100%;
        background: transparent;
        color: #ffffff;
        border: 0;
        outline: 0;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
      }

      .compact-select-box select option {
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
      }

      .compact-right-stats {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .compact-stat-pill {
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 2px 7px;
        font-size: 11.5px;
        font-weight: 800;
        white-space: nowrap;
      }

      .compact-progress-line {
        height: 3px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 6px;
        overflow: hidden;
        margin: 5px 0 4px;
      }

      .compact-progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 6px;
        background: #ffffff;
        transition: width 0.3s ease;
      }

      /* Compact Sub Row with Date and Momenur Badge */
      .compact-sub-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }

      .compact-date-nav {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .c-date-btn {
        width: 22px;
        height: 20px;
        border: 0;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .c-date-display {
        height: 20px;
        padding: 0 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }

      /* Momenur Signature in Compact Header Empty Space */
      .compact-momenur-badge {
        font-size: 11px;
        font-weight: 800;
        color: #ffffff;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 5px;
        padding: 1px 7px;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }

      /* ===== COMPACT SEARCH & FILTER BAR ===== */
      .search-filter-bar {
        display: flex;
        gap: 6px;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 4px 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      }

      .search-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
      }

      .search-icon {
        position: absolute;
        left: 8px;
        font-size: 13px;
        opacity: 0.55;
        pointer-events: none;
      }

      .search-wrap input {
        width: 100%;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 8px 0 26px;
        font-size: 12px;
        font-weight: 600;
        outline: 0;
        background: var(--bg);
        color: var(--text);
      }

      .search-wrap input:focus {
        border-color: var(--primary);
        background: var(--card);
      }

      .filter-tabs {
        display: flex;
        gap: 3px;
      }

      .filter-pill {
        white-space: nowrap;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--muted);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 800;
        transition: background-color 0.12s ease, color 0.12s ease;
      }

      .filter-pill.active {
        background: var(--primary);
        color: #ffffff;
        border-color: var(--primary);
      }

      /* ===== STUDENT LIST ===== */
      .student-list {
        background: var(--card);
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
        margin-top: 4px;
      }

      .list-header {
        display: grid;
        grid-template-columns: 34px 58px 1fr 50px;
        gap: 8px;
        align-items: center;
        padding: 9px 12px;
        background: rgba(37, 99, 235, 0.04);
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .student {
        display: grid;
        grid-template-columns: 34px 58px 1fr 50px;
        gap: 8px;
        align-items: center;
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
        transition: background-color 0.12s ease, box-shadow 0.12s ease;
        cursor: pointer;
        user-select: none;
        box-shadow: inset 0 0 0 transparent;
      }

      .student:last-child {
        border-bottom: 0;
      }

      .student:hover {
        background-color: var(--card-hover);
      }

      .student.present {
        background-color: var(--success-bg);
        box-shadow: inset 4px 0 0 var(--success);
      }

      .serial {
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 700;
      }

      .student-id {
        font-size: 14px;
        font-weight: 800;
        color: var(--primary);
        font-variant-numeric: tabular-nums;
      }

      .student-name {
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1.3;
      }

      .status-text {
        font-size: 9.5px;
        margin-top: 2px;
        color: var(--muted);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .student.present .status-text {
        color: var(--success);
      }

      .check-area {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .check-area input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 25px;
        height: 25px;
        border: 2px solid #cbd5e1;
        border-radius: 7px;
        cursor: pointer;
        position: relative;
        background: var(--card);
        transition: background-color 0.12s ease, border-color 0.12s ease;
      }

      body.dark .check-area input[type="checkbox"] {
        border-color: #334155;
      }

      .check-area input[type="checkbox"]:checked {
        background: var(--success);
        border-color: var(--success);
      }

      .check-area input[type="checkbox"]:checked::after {
        content: "✓";
        color: #ffffff;
        font-size: 15px;
        font-weight: 900;
        position: absolute;
        left: 5px;
        top: 0px;
      }

      .empty-message {
        text-align: center;
        padding: 35px 14px;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 700;
      }

      /* ===== COMPACT FIXED FOOTER ===== */
      .footer-fixed {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;
        padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
        background: var(--footer-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid var(--border);
        box-shadow: var(--footer-shadow);
      }

      .footer-fixed-inner {
        max-width: 800px;
        margin: 0 auto;
        position: relative;
      }

      .footer-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 5px;
      }

      .action-button {
        min-height: 34px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: background-color 0.12s ease;
      }

      .reset-btn {
        background: var(--danger-bg);
        color: var(--danger);
        border-color: rgba(220, 38, 38, 0.2);
      }

      .reset-btn:hover {
        background: rgba(220, 38, 38, 0.15);
      }

      .more-btn {
        background: var(--card);
        color: var(--text);
      }

      /* ===== MORE DROPDOWN MENU ===== */
      .more-menu {
        display: none;
        position: absolute;
        right: 0;
        bottom: 100%;
        margin-bottom: 6px;
        z-index: 1100;
        min-width: 220px;
        padding: 5px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }

      .more-menu.show {
        display: block;
      }

      .more-menu-header {
        font-size: 10.5px;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
        padding: 6px 10px 3px;
        letter-spacing: 0.4px;
      }

      .more-menu button {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 700;
        transition: background-color 0.12s ease;
      }

      .more-menu button:hover {
        background: var(--card-hover);
        color: var(--primary);
      }

      /* ===== OUTPUT PREVIEW BOX ===== */
      .footer-output {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }

      .output-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
      }

      .output-title h2 {
        font-size: 12px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .output-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 18px;
        padding: 0 5px;
        border-radius: 8px;
        background: rgba(37, 99, 235, 0.12);
        color: var(--primary);
        font-size: 10.5px;
        font-weight: 800;
      }

      .copy-btn {
        border: 0;
        background: var(--primary);
        color: #ffffff;
        border-radius: 6px;
        padding: 4px 14px;
        font-size: 11.5px;
        font-weight: 800;
        transition: background-color 0.12s ease;
      }

      .copy-btn:hover {
        background: var(--primary-dark);
      }

      .output-box {
        max-height: 58px;
        min-height: 38px;
        overflow-y: auto;
        padding: 5px 10px;
        background: var(--bg);
      }

      .output-box pre {
        margin: 0;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.45;
        font-weight: 700;
        color: var(--text);
      }

      .output-placeholder {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 0;
      }

      /* ===== TOAST NOTIFICATION ===== */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 25px;
        transform: translate(-50%, 70px);
        background: #0f172a;
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        z-index: 99999;
        opacity: 0;
        transition: transform 0.22s ease, opacity 0.22s ease;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        pointer-events: none;
      }

      body.dark .toast {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #334155;
      }

      .toast.show {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      /* ===== PRINT STYLES ===== */
      @media print {
        body {
          background: #ffffff !important;
          color: #000000 !important;
          padding: 0 !important;
        }

        .hero-header,
        .sticky-wrapper,
        .footer-fixed,
        .more-menu,
        .toast {
          display: none !important;
        }

        .print-sheet-header {
          display: block !important;
          margin-bottom: 16px;
          padding-bottom: 10px;
          border-bottom: 2px solid #000;
        }

        .student-list {
          border: 1px solid #000 !important;
          box-shadow: none !important;
          margin-bottom: 0 !important;
        }

        .list-header {
          background: #eee !important;
          color: #000 !important;
          border-bottom: 2px solid #000 !important;
        }

        .student {
          border-bottom: 1px solid #ccc !important;
          color: #000 !important;
          break-inside: avoid;
        }

        .student.present {
          background: #f0fdf4 !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        .check-area input {
          display: none !important;
        }

        .check-area::after {
          content: "—";
        }

        .student.present .check-area::after {
          content: "✓ PRESENT";
          color: #16a34a;
          font-weight: bold;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Print Sheet Header -->
      <div class="print-sheet-header" id="printSheetHeader" style="display: none;">
        <h2 style="font-size: 20px; margin-bottom: 4px;">Attendance Sheet - Loopify</h2>
        <div style="font-size: 13px; line-height: 1.5;">
          <div><strong>Course:</strong> <span id="printCourseName"></span></div>
          <div><strong>Date:</strong> <span id="printDateName"></span></div>
          <div><strong>Summary:</strong> <span id="printSummary"></span></div>
        </div>
      </div>

      <!-- 1. ORIGINAL FULL HERO HEADER (VISIBLE AT TOP OF PAGE) -->
      <header class="hero-header" id="heroHeader">
        <div class="hero-header-content">
          <div class="hero-header-top">
            <div>
              <h1 class="hero-title">Loopify 💕</h1>
              <p class="hero-subtitle">By Momenur Rashid</p>
              <div class="hero-date-text" id="heroFullDate"></div>
            </div>
            <button
              class="theme-btn"
              type="button"
              onclick="toggleTheme()"
              id="themeButtonHero"
              title="Toggle Dark/Light Mode"
              aria-label="Toggle Theme"
            >
              🌙
            </button>
          </div>

          <!-- Course Selector -->
          <div class="hero-course-bar">
            <label for="heroCourseSelect">📚 Course:</label>
            <select id="heroCourseSelect" onchange="onCourseSelectChange(this.value)" aria-label="Select Course">
              <!-- Populated via JS -->
            </select>
          </div>

          <!-- Live Attendance Summary -->
          <div class="hero-live-summary">
            <div class="hero-live-status">
              <span class="live-dot"></span>
              <span id="heroAttendanceStatus">Ready to Take Attendance</span>
            </div>
            <strong>
              <span id="heroPresent">0</span> / <span id="heroTotal">46</span> Present
            </strong>
          </div>

          <div class="hero-progress">
            <div class="hero-progress-fill" id="heroProgressFill"></div>
          </div>
          <div class="hero-percentage" id="heroPercentage">0%</div>

          <!-- Date Selector -->
          <div class="hero-date-selector">
            <button type="button" class="date-nav-btn" onclick="changeDate(-1)" aria-label="Previous Day" title="Previous Day">‹</button>
            <div class="hero-date-display" onclick="openDatePicker()" title="Click to pick specific date">
              📅 <span id="heroDateDisplay"></span>
            </div>
            <button type="button" class="date-nav-btn" onclick="changeDate(1)" aria-label="Next Day" title="Next Day">›</button>
          </div>
        </div>
      </header>

      <!-- 2. STICKY LOCKED HEADER (EXPANDS INTO COMPACT BAR WHEN SCROLLED) -->
      <div class="sticky-wrapper" id="stickyWrapper">
        <div class="compact-sticky-header" id="compactStickyHeader">
          <div class="compact-main-row">
            <div class="compact-brand-course">
              <span class="compact-logo">Loopify 💕</span>
              <div class="compact-select-box">
                <select id="compactCourseSelect" onchange="onCourseSelectChange(this.value)" aria-label="Select Course">
                  <!-- Populated via JS -->
                </select>
              </div>
            </div>
            <div class="compact-right-stats">
              <div class="compact-stat-pill" title="Present / Total">
                <span class="live-dot"></span>
                <span id="compactPresent">0</span>/<span id="compactTotal">46</span>
                <span id="compactPercentage" style="opacity:0.85;">0%</span>
              </div>
              <button
                class="theme-btn"
                type="button"
                style="width: 26px; height: 26px; font-size: 13px;"
                onclick="toggleTheme()"
                id="themeButtonCompact"
                title="Toggle Theme"
              >
                🌙
              </button>
            </div>
          </div>

          <div class="compact-progress-line">
            <div class="compact-progress-fill" id="compactProgressFill"></div>
          </div>

          <!-- Compact Sub Row: Date Navigation on Left, "Momenur" on Right -->
          <div class="compact-sub-row">
            <div class="compact-date-nav">
              <button type="button" class="c-date-btn" onclick="changeDate(-1)">‹</button>
              <div class="c-date-display" onclick="openDatePicker()">
                📅 <span id="compactDateDisplay"></span>
              </div>
              <button type="button" class="c-date-btn" onclick="changeDate(1)">›</button>
            </div>
            <!-- Momenur badge placed in the empty space on right of date -->
            <div class="compact-momenur-badge">Momenur Rashid</div>
          </div>
        </div>

        <!-- Search & Filter Bar (Always Locked with Sticky) -->
        <div class="search-filter-bar">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="searchInput"
              placeholder="Search ID or name..."
              oninput="searchStudents()"
              aria-label="Search students"
            />
          </div>
          <div class="filter-tabs">
            <button class="filter-pill active" type="button" onclick="setFilter('all', this)">All</button>
            <button class="filter-pill" type="button" onclick="setFilter('present', this)">🟢 Present</button>
            <button class="filter-pill" type="button" onclick="setFilter('absent', this)">🔴 Absent</button>
          </div>
        </div>
      </div>

      <!-- Native Date Picker Input (Hidden trigger) -->
      <input type="date" id="datePicker" onchange="loadSelectedDate()" aria-label="Select Date" style="position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;" />

      <!-- Student List (Maximum Display Room) -->
      <main class="student-list">
        <div class="list-header">
          <div>#</div>
          <div>ID</div>
          <div>Student</div>
          <div style="text-align: center">Status</div>
        </div>
        <div id="studentList"></div>
      </main>

      <!-- Fixed Compact Footer -->
      <footer class="footer-fixed">
        <div class="footer-fixed-inner">
          <div class="footer-controls">
            <button class="action-button reset-btn" type="button" onclick="clearAll()">
              ↻ Reset
            </button>
            <button
              class="action-button more-btn"
              type="button"
              id="moreBtn"
              onclick="toggleMoreMenu(event)"
            >
              ⋮ More
            </button>
          </div>

          <!-- Dropdown Popup Menu -->
          <div class="more-menu" id="moreMenu">
            <div class="more-menu-header">Attendance Options</div>
            <button type="button" onclick="copyAbsentList()">
              📋 Copy Absent List
            </button>
            <button type="button" onclick="copyRawPresentIDs()">
              🔢 Copy Present (IDs Only)
            </button>
            <button type="button" onclick="markAllPresent()">
              ✓ Mark All Present
            </button>
            <button type="button" onclick="undoLastAction()">
              ↩ Undo Last Action
            </button>
            <button type="button" onclick="window.print()">
              🖨️ Print Sheet
            </button>
            <div class="more-menu-header">Export Data</div>
            <button type="button" onclick="exportTXT()">
              📄 Export TXT
            </button>
            <button type="button" onclick="exportCSV()">
              📊 Export CSV
            </button>
          </div>

          <!-- Output Box -->
          <div class="footer-output">
            <div class="output-title">
              <h2>
                📋 Present Message
                <span class="output-count" id="outputCount">0</span>
              </h2>
              <button class="copy-btn" type="button" onclick="copyResult()">
                COPY
              </button>
            </div>
            <div class="output-box" id="outputBox">
              <div class="output-placeholder" id="outputPlaceholder">
                Mark students present to generate message
              </div>
              <pre id="outputText" style="display: none;"></pre>
            </div>
            <textarea id="output" readonly hidden></textarea>
          </div>
        </div>
      </footer>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      // ===== HARDCODED COURSES =====
      const courses = [
        "Parallel Processing",
        "Parallel Processing Lab",
        "Cryptography",
        "Cryptography Lab",
        "Big Data",
        "Big Data Lab",
        "Machine Learning",
        "Machine Learning Lab",
      ];

      // ===== STUDENTS LIST =====
      const students = [
        ["231311002", "UMME HABIBA"],
        ["231311003", "MD. WAHID OBAER SAJID"],
        ["231311006", "MST. NADIA TABASSUM SAWDA"],
        ["231311007", "MST. AFSANA YEASMIN BARSHA"],
        ["231311008", "SAHIL YASAR"],
        ["231311009", "S. M. FAHAD ALL ABAIR BRINTHO"],
        ["231311010", "MD. TAHMID ALAM FIDA"],
        ["231311013", "MD. MISBAUL ALAM"],
        ["231311014", "RIFAH SHAJIDA ISLAM"],
        ["231311015", "MAKSUDUL ISLAM MOHAMMAD MUHIT"],
        ["231311016", "AFIA ISLAM"],
        ["231311017", "ASFIA NAIMOON NAHAR NAMME"],
        ["231311020", "ARITRA SARKAR"],
        ["231311021", "MD. RAHATUL ISLAM"],
        ["231311022", "MD. NUR AMAN"],
        ["231311023", "SAMIHA FARJANA"],
        ["231311024", "MD. SHAKIL AHMED"],
        ["231311025", "SAHRUK ALAM SARDER"],
        ["231311026", "MD. PARVEZ MOSHAROF"],
        ["231311027", "MST. ARIFA AKHTAR CHANDNI"],
        ["231311032", "REZWANA KARIM"],
        ["231311034", "MD KARIM"],
        ["231311035", "MST. KHADIZA ALAM MOMI"],
        ["231311036", "MD. HASIB NADIM"],
        ["231311038", "MD. NAZMUL HASAN"],
        ["231311040", "MD. FAHIM AKHTAR"],
        ["231311081", "NAWSHIN SULTANA"],
        ["231311083", "RAHUL KHAN RAJ"],
        ["231311084", "MD. SHIBLU HOSSEN"],
        ["231311086", "MST. ROHIMA AKTER RIMI"],
        ["231311090", "MD. SHAHRIAR HASAN TONMOY"],
        ["231311094", "HASIB AL NABIL"],
        ["231311096", "MD. MOMENUR RASHID"],
        ["231311101", "MD. SABIUR RAHMAN"],
        ["231311102", "MST. AYESHA SIDDIQUA"],
        ["231311103", "MOST. IFFAT SARMILA"],
        ["231311104", "MST. SUMAYA KHATUN"],
        ["231311105", "FATEMATUZZOHURA BORSHA"],
        ["231311106", "RAISHA NURAYAN POROMA"],
        ["231311114", "MD. BISHAL SARKAR"],
        ["231311117", "MST. SUMIA SHARMIN NITU"],
        ["231311118", "SHAMIA AKTER NIPA"],
        ["231311122", "ISRAT JAHAN EMU"],
        ["231311125", "MD. NAFIZUR RAHMAN PARVEZ"],
        ["231311127", "MD. ABDULLAH AL-IBN-REAL SHAOWN"],
        ["231311128", "MAHFUJUR RAHMAN SHANTO"],
      ].map(([id, name]) => ({ id, name }));

      // ===== APPLICATION STATE =====
      let attendance = {};
      let currentFilter = "all";
      let currentDate = getTodayDate();
      let currentCourse = getSavedCourse();
      let previousAttendance = null;

      // DOM Elements
      const studentList = document.getElementById("studentList");
      const datePicker = document.getElementById("datePicker");
      const output = document.getElementById("output");
      const heroCourseSelect = document.getElementById("heroCourseSelect");
      const compactCourseSelect = document.getElementById("compactCourseSelect");

      // ===== DATE HELPERS (TIMEZONE SAFE) =====
      function formatDateLocal(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function parseDateLocal(str) {
        if (!str) return new Date();
        const parts = str.split("-").map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function getTodayDate() {
        return formatDateLocal(new Date());
      }

      function formatFullDate(str) {
        const d = parseDateLocal(str);
        return d.toLocaleDateString("en-US", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      function formatDisplayDate(str) {
        const d = parseDateLocal(str);
        return d.toLocaleDateString("en-US", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      // ===== STORAGE HELPERS =====
      function getSavedCourse() {
        try {
          const saved = localStorage.getItem("attendance_course");
          if (saved && courses.includes(saved)) {
            return saved;
          }
        } catch (e) {}
        return courses[0];
      }

      function storageKey() {
        return `attendance_${currentDate}`;
      }

      function saveAttendance() {
        try {
          localStorage.setItem(storageKey(), JSON.stringify(attendance));
        } catch (e) {
          console.error("Failed to save to localStorage", e);
        }
      }

      function loadAttendance() {
        try {
          const saved =
            localStorage.getItem(storageKey()) ||
            localStorage.getItem(`attendance_${currentDate}_${currentCourse.replace(/\s+/g, "_")}`);
          attendance = saved ? JSON.parse(saved) : {};
        } catch (e) {
          console.error("Failed to load from localStorage", e);
          attendance = {};
        }
      }

      // ===== COURSE MANAGEMENT (SYNCS BOTH EXPANDED & COMPACT DROPDOWNS) =====
      function populateCourses() {
        const selects = [heroCourseSelect, compactCourseSelect];
        selects.forEach((sel) => {
          if (!sel) return;
          sel.innerHTML = "";
          courses.forEach((c) => {
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            if (c === currentCourse) opt.selected = true;
            sel.appendChild(opt);
          });
        });
      }

      function onCourseSelectChange(val) {
        currentCourse = val;
        try {
          localStorage.setItem("attendance_course", currentCourse);
        } catch (e) {}

        if (heroCourseSelect && heroCourseSelect.value !== val) {
          heroCourseSelect.value = val;
        }
        if (compactCourseSelect && compactCourseSelect.value !== val) {
          compactCourseSelect.value = val;
        }

        saveAttendance();
        updateStats();
        updateOutputLive();
        showToast(`📚 Switched to: ${currentCourse}`);
      }

      // ===== DATE MANAGEMENT =====
      function updateDateDisplay() {
        if (datePicker) datePicker.value = currentDate;
        const displayDate = formatDisplayDate(currentDate);
        const fullDate = formatFullDate(currentDate);

        const heroDate = document.getElementById("heroFullDate");
        const heroDisplay = document.getElementById("heroDateDisplay");
        const compactDisplay = document.getElementById("compactDateDisplay");

        if (heroDate) heroDate.textContent = fullDate;
        if (heroDisplay) heroDisplay.textContent = displayDate;
        if (compactDisplay) compactDisplay.textContent = displayDate;
      }

      function loadSelectedDate() {
        currentDate = (datePicker && datePicker.value) ? datePicker.value : getTodayDate();
        loadAttendance();
        previousAttendance = null;
        if (output) output.value = "";
        updateDateDisplay();
        renderStudents();
        updateStats();
        updateOutputLive();
        showToast("Attendance loaded");
      }

      function changeDate(days) {
        const d = parseDateLocal(currentDate);
        d.setDate(d.getDate() + days);
        currentDate = formatDateLocal(d);
        loadSelectedDate();
      }

      function openDatePicker() {
        if (!datePicker) return;
        if (typeof datePicker.showPicker === "function") {
          try {
            datePicker.showPicker();
            return;
          } catch (e) {}
        }
        datePicker.click();
      }

      // ===== SCROLL LISTENER: COMPACT HEADER LOCKS ON SCROLL =====
      let isHeaderScrolled = false;
      function onWindowScroll() {
        const scrollY = window.scrollY || document.documentElement.scrollTop;
        // When scrolled past ~40px, show compact locked header
        const shouldBeScrolled = scrollY > 40;
        if (shouldBeScrolled !== isHeaderScrolled) {
          isHeaderScrolled = shouldBeScrolled;
          document.body.classList.toggle("is-scrolled", isHeaderScrolled);
        }
      }
      window.addEventListener("scroll", onWindowScroll, { passive: true });

      // ===== FAST IN-PLACE DOM UPDATE (ZERO FLICKER) =====
      function applyAttendanceToDOM(id, isPresent) {
        const row = studentList.querySelector(`[data-id="${id}"]`);
        if (!row) return;

        if (isPresent) {
          row.classList.add("present");
        } else {
          row.classList.remove("present");
        }

        const statusText = row.querySelector(".status-text");
        if (statusText) {
          statusText.textContent = isPresent ? "● PRESENT" : "○ ABSENT";
        }

        const checkbox = row.querySelector('input[type="checkbox"]');
        if (checkbox && checkbox.checked !== isPresent) {
          checkbox.checked = isPresent;
        }

        if (currentFilter === "present") {
          row.style.display = isPresent ? "" : "none";
        } else if (currentFilter === "absent") {
          row.style.display = !isPresent ? "" : "none";
        }
      }

      // ===== ATTENDANCE TOGGLE =====
      function setAttendance(id, checked) {
        previousAttendance = JSON.stringify(attendance);

        if (checked) {
          attendance[id] = true;
        } else {
          delete attendance[id];
        }

        applyAttendanceToDOM(id, checked);
        saveAttendance();
        updateStats();
      }

      function toggleStudentRow(id) {
        previousAttendance = JSON.stringify(attendance);

        if (attendance[id]) {
          delete attendance[id];
          applyAttendanceToDOM(id, false);
          showToast("Marked Absent");
        } else {
          attendance[id] = true;
          applyAttendanceToDOM(id, true);
          showToast("✓ Marked Present");
        }

        saveAttendance();
        updateStats();
      }

      // ===== STUDENT RENDERING =====
      function renderStudents() {
        if (!studentList) return;
        studentList.innerHTML = "";

        const searchInput = document.getElementById("searchInput");
        const search = searchInput ? searchInput.value.toLowerCase().trim() : "";

        const filtered = students.filter((s) => {
          const matchSearch =
            s.id.toLowerCase().includes(search) ||
            s.id.slice(-3).includes(search) ||
            s.name.toLowerCase().includes(search);

          const isPresent = !!attendance[s.id];

          return (
            matchSearch &&
            (currentFilter === "all" ||
              (currentFilter === "present" && isPresent) ||
              (currentFilter === "absent" && !isPresent))
          );
        });

        if (!filtered.length) {
          studentList.innerHTML =
            '<div class="empty-message">🔍 No students found.</div>';
          updateStats();
          return;
        }

        filtered.forEach((s) => {
          const isPresent = !!attendance[s.id];
          const row = document.createElement("div");
          row.className = "student" + (isPresent ? " present" : "");
          row.setAttribute("data-id", s.id);

          row.innerHTML = `
            <div class="serial">${String(students.indexOf(s) + 1).padStart(2, "0")}</div>
            <div class="student-id">${s.id.slice(-3)}</div>
            <div>
              <div class="student-name">${s.name}</div>
              <div class="status-text">${isPresent ? "● PRESENT" : "○ ABSENT"}</div>
            </div>
            <div class="check-area">
              <input type="checkbox" ${isPresent ? "checked" : ""} aria-label="Mark ${s.name} present">
            </div>
          `;

          const checkbox = row.querySelector('input[type="checkbox"]');

          checkbox.addEventListener("click", (e) => {
            e.stopPropagation();
          });

          checkbox.addEventListener("change", () => {
            setAttendance(s.id, checkbox.checked);
          });

          row.addEventListener("click", () => {
            toggleStudentRow(s.id);
          });

          studentList.appendChild(row);
        });

        updateStats();
      }

      // ===== STATS & OUTPUT =====
      function updateStats() {
        const present = students.filter((s) => !!attendance[s.id]).length;
        const total = students.length;
        const percent = total ? (present / total) * 100 : 0;
        const pctFormatted = percent.toFixed(0) + "%";

        // Update Hero elements
        const heroPresent = document.getElementById("heroPresent");
        const heroTotal = document.getElementById("heroTotal");
        const heroPercentage = document.getElementById("heroPercentage");
        const heroProgressFill = document.getElementById("heroProgressFill");
        const heroStatus = document.getElementById("heroAttendanceStatus");

        if (heroPresent) heroPresent.textContent = present;
        if (heroTotal) heroTotal.textContent = total;
        if (heroPercentage) heroPercentage.textContent = pctFormatted;
        if (heroProgressFill) heroProgressFill.style.width = percent + "%";

        // Update Compact sticky elements
        const compactPresent = document.getElementById("compactPresent");
        const compactTotal = document.getElementById("compactTotal");
        const compactPercentage = document.getElementById("compactPercentage");
        const compactProgressFill = document.getElementById("compactProgressFill");

        if (compactPresent) compactPresent.textContent = present;
        if (compactTotal) compactTotal.textContent = total;
        if (compactPercentage) compactPercentage.textContent = pctFormatted;
        if (compactProgressFill) compactProgressFill.style.width = percent + "%";

        if (heroStatus) {
          heroStatus.textContent =
            present === total
              ? "Attendance Complete"
              : present > 0
                ? "Attendance In Progress"
                : "Ready to Take Attendance";
        }

        // Print header
        const printCourseName = document.getElementById("printCourseName");
        const printDateName = document.getElementById("printDateName");
        const printSummary = document.getElementById("printSummary");
        if (printCourseName) printCourseName.textContent = currentCourse;
        if (printDateName) printDateName.textContent = formatFullDate(currentDate);
        if (printSummary)
          printSummary.textContent = `${present} Present / ${total - present} Absent (${pctFormatted})`;

        updateOutputLive();
      }

      function searchStudents() {
        renderStudents();
      }

      function setFilter(f, btn) {
        currentFilter = f;
        document
          .querySelectorAll(".filter-pill")
          .forEach((x) => x.classList.remove("active"));
        if (btn) btn.classList.add("active");
        renderStudents();
      }

      function buildPresentMessage() {
        const presentStudents = students.filter((s) => !!attendance[s.id]);
        if (!presentStudents.length) return "";

        const ids = presentStudents.map((s) => s.id.slice(-3)).join("\n");
        const dateFormatted = formatDisplayDate(currentDate);

        return `Assalamu Alaikum Sir,\n${currentCourse} (${dateFormatted}) er present list:\n\n${ids}`;
      }

      function updateOutputLive() {
        const presentStudents = students.filter((s) => !!attendance[s.id]);
        const text = buildPresentMessage();

        const outputText = document.getElementById("outputText");
        const outputCount = document.getElementById("outputCount");
        const outputPlaceholder = document.getElementById("outputPlaceholder");

        if (outputText) {
          outputText.textContent = text;
          outputText.style.display = presentStudents.length ? "block" : "none";
        }

        if (outputCount) {
          outputCount.textContent = presentStudents.length;
        }

        if (outputPlaceholder) {
          outputPlaceholder.style.display = presentStudents.length
            ? "none"
            : "block";
        }

        if (output) {
          output.value = text;
        }
      }

      // ===== COPY ACTIONS =====
      function copyResult() {
        const text = buildPresentMessage();
        if (!text) {
          return showToast("No students are marked Present yet");
        }
        copyText(text);
        showToast(`✓ Present list copied for ${currentCourse}`);
      }

      function copyRawPresentIDs() {
        closeMoreMenu();
        const ids = students
          .filter((s) => !!attendance[s.id])
          .map((s) => s.id.slice(-3));
        if (!ids.length) {
          return showToast("No Present students");
        }
        copyText(ids.join("\n"));
        showToast(`✓ ${ids.length} Present IDs copied (raw)`);
      }

      function copyAbsentList() {
        closeMoreMenu();
        const absentStudents = students.filter((s) => !attendance[s.id]);
        if (!absentStudents.length) {
          return showToast("Everyone is Present! No absent students.");
        }

        const dateFormatted = formatFullDate(currentDate);
        const list = absentStudents
          .map((s, idx) => `${idx + 1}. ${s.id} - ${s.name}`)
          .join("\n");

        const message = `Date: ${dateFormatted}\nCourse: ${currentCourse}\nTotal Absent: ${absentStudents.length}\n\nAbsent Students:\n${list}`;

        copyText(message);
        showToast(`📋 ${absentStudents.length} Absent student(s) copied`);
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const t = document.createElement("textarea");
        t.value = text;
        t.style.position = "fixed";
        t.style.top = "-9999px";
        t.style.left = "-9999px";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.focus();
        t.select();
        try {
          document.execCommand("copy");
        } catch (e) {
          console.error("Copy command failed", e);
        }
        t.remove();
      }

      // ===== MORE MENU =====
      function toggleMoreMenu(event) {
        if (event) event.stopPropagation();
        const menu = document.getElementById("moreMenu");
        if (menu) menu.classList.toggle("show");
      }

      function closeMoreMenu() {
        const menu = document.getElementById("moreMenu");
        if (menu) menu.classList.remove("show");
      }

      document.addEventListener("click", (e) => {
        const menu = document.getElementById("moreMenu");
        const moreBtn = document.getElementById("moreBtn");
        if (menu && menu.classList.contains("show")) {
          if (!menu.contains(e.target) && (!moreBtn || !moreBtn.contains(e.target))) {
            menu.classList.remove("show");
          }
        }
      });

      // ===== BULK ACTIONS =====
      function markAllPresent() {
        closeMoreMenu();
        const total = students.length;
        if (Object.keys(attendance).length === total) {
          return showToast("All students are already Present");
        }

        if (!confirm(`Mark all ${total} students as Present for ${currentCourse}?`))
          return;

        previousAttendance = JSON.stringify(attendance);
        students.forEach((s) => (attendance[s.id] = true));

        saveAttendance();
        renderStudents();
        showToast("✓ All students marked Present");
      }

      function clearAll() {
        closeMoreMenu();
        const count = Object.keys(attendance).length;
        if (!count) {
          return showToast("Attendance is already empty");
        }

        if (!confirm(`Reset attendance for today?`)) return;

        previousAttendance = JSON.stringify(attendance);
        attendance = {};

        saveAttendance();
        renderStudents();
        showToast("Attendance reset");
      }

      function undoLastAction() {
        closeMoreMenu();
        if (previousAttendance === null) {
          return showToast("Nothing to undo");
        }

        try {
          attendance = JSON.parse(previousAttendance);
          previousAttendance = null;
          saveAttendance();
          renderStudents();
          showToast("↩ Last action undone");
        } catch (e) {
          showToast("Could not undo action");
        }
      }

      // ===== EXPORT =====
      function downloadFile(content, name, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function exportTXT() {
        closeMoreMenu();
        const presentStudents = students.filter((s) => !!attendance[s.id]);
        if (!presentStudents.length) return showToast("No Present students to export");

        const text = buildPresentMessage();
        const cleanCourse = currentCourse.replace(/[^a-zA-Z0-9]/g, "_");
        downloadFile(
          text,
          `attendance_${cleanCourse}_${currentDate}.txt`,
          "text/plain",
        );
        showToast("TXT file downloaded");
      }

      function exportCSV() {
        closeMoreMenu();
        let csv = "Serial,ID,Student Name,Status,Course,Date\n";
        students.forEach((s, idx) => {
          const status = attendance[s.id] ? "Present" : "Absent";
          csv += `"${idx + 1}","${s.id}","${s.name.replace(/"/g, '""')}","${status}","${currentCourse}","${currentDate}"\n`;
        });
        const cleanCourse = currentCourse.replace(/[^a-zA-Z0-9]/g, "_");
        downloadFile(
          csv,
          `attendance_${cleanCourse}_${currentDate}.csv`,
          "text/csv",
        );
        showToast("CSV file downloaded");
      }

      // ===== THEME =====
      function toggleTheme() {
        document.body.classList.toggle("dark");
        const isDark = document.body.classList.contains("dark");
        try {
          localStorage.setItem("attendance_theme", isDark ? "dark" : "light");
        } catch (e) {}

        const themeBtnHero = document.getElementById("themeButtonHero");
        const themeBtnCompact = document.getElementById("themeButtonCompact");
        if (themeBtnHero) themeBtnHero.textContent = isDark ? "☀️" : "🌙";
        if (themeBtnCompact) themeBtnCompact.textContent = isDark ? "☀️" : "🌙";
      }

      function loadTheme() {
        try {
          if (localStorage.getItem("attendance_theme") === "dark") {
            document.body.classList.add("dark");
            const themeBtnHero = document.getElementById("themeButtonHero");
            const themeBtnCompact = document.getElementById("themeButtonCompact");
            if (themeBtnHero) themeBtnHero.textContent = "☀️";
            if (themeBtnCompact) themeBtnCompact.textContent = "☀️";
          }
        } catch (e) {}
      }

      // ===== TOAST =====
      let toastTimer = null;
      function showToast(msg) {
        const t = document.getElementById("toast");
        if (!t) return;
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          t.classList.remove("show");
        }, 2200);
      }

      // ===== INITIALIZATION =====
      function initialize() {
        loadTheme();
        populateCourses();
        updateDateDisplay();
        loadAttendance();
        renderStudents();
        updateStats();

        // Register Service Worker for offline PWA support
        if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
          navigator.serviceWorker
            .register("./sw.js")
            .then(() => {
              console.log("Loopify Service Worker registered for offline use.");
            })
            .catch((err) => {
              console.warn("Service Worker registration failed:", err);
            });
        }
      }

      document.addEventListener("DOMContentLoaded", initialize);
      if (document.readyState === "interactive" || document.readyState === "complete") {
        initialize();
      }
    </script>
  </body>
</html>
